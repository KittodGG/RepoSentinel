name: RepoSentinel

description: Scan repository readiness locally in GitHub Actions with multilingual terminal, Markdown, JSON, SARIF, or HTML output.
author: RepoSentinel contributors
branding:
  color: cyan
  icon: shield

inputs:
  profile:
    description: "Repository profile: public, portfolio, or npm-package."
    required: false
    default: public
  lang:
    description: "UI locale: en or id."
    required: false
    default: en
  fail-on:
    description: "Minimum severity that makes the action fail: critical, error, warning, or info."
    required: false
    default: error
  format:
    description: "Report format: terminal, markdown, json, sarif, or html."
    required: false
    default: markdown
  changed-since:
    description: "Optional Git base ref; only findings on changed files are reported."
    required: false
    default: ""
  output:
    description: Optional report path relative to the repository workspace.
    required: false
    default: reposentinel-report.md

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: 10.15.0

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ${{ github.action_path }}/.nvmrc
        cache: pnpm
        cache-dependency-path: ${{ github.action_path }}/pnpm-lock.yaml

    - name: Install RepoSentinel workspace
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        pnpm install --frozen-lockfile
        pnpm --filter reposentinel build

    - name: Scan repository
      shell: bash
      env:
        RS_PROFILE: ${{ inputs.profile }}
        RS_LANG: ${{ inputs.lang }}
        RS_FAIL_ON: ${{ inputs.fail-on }}
        RS_FORMAT: ${{ inputs.format }}
        RS_CHANGED_SINCE: ${{ inputs.changed-since }}
        RS_OUTPUT: ${{ inputs.output }}
      run: |
        set -euo pipefail
        args=(check "$GITHUB_WORKSPACE" --profile "$RS_PROFILE" --lang "$RS_LANG" --fail-on "$RS_FAIL_ON" --format "$RS_FORMAT" --no-color)
        if [[ -n "$RS_CHANGED_SINCE" ]]; then
          args+=(--changed-since "$RS_CHANGED_SINCE")
        fi
        if [[ -n "$RS_OUTPUT" ]]; then
          args+=(--output "$GITHUB_WORKSPACE/$RS_OUTPUT")
        fi
        node "$GITHUB_ACTION_PATH/packages/cli/dist/index.js" "${args[@]}"
