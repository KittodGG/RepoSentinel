extends: recommended
profile: public

ignore:
  # Positive security fixtures are validated by the stable matrix, not dogfood.
  - fixtures/**
  # Corpus checkouts are other projects' repositories; their test certificates
  # and fixtures are not this repository's exposure.
  - .cache/**
  - node_modules/**
  - dist/**
  - coverage/**

# Keep all built-in rules enabled in dogfood so governance regressions are visible.
rules: {}

security:
  network: false
  scan_history: false
  redact_findings: true

ci:
  fail_on: error
