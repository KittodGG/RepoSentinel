<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">RepoSentinel repository readiness CLI</title>
  <desc id="desc">A dark terminal-inspired banner with a glowing sentinel mark, readiness grid, and bilingual tagline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="55%" stop-color="#0b1930"/>
      <stop offset="100%" stop-color="#11102b"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="20%" stop-color="#38bdf8" stop-opacity=".8"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity=".9"/>
      <stop offset="80%" stop-color="#38bdf8" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.4"/>
    </filter>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#8be9fd" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
    <clipPath id="frame-clip">
      <rect x="24" y="24" width="1552" height="472" rx="16"/>
    </clipPath>
  </defs>

  <!-- Background & Frame -->
  <rect width="1600" height="520" rx="24" fill="url(#bg)"/>
  
  <g clip-path="url(#frame-clip)">
    <rect x="24" y="24" width="1552" height="472" fill="url(#grid)"/>
    
    <!-- Balanced Ambient Glows -->
    <circle cx="400" cy="260" r="200" fill="#38bdf8" opacity=".12" filter="url(#glow)"/>
    <circle cx="1300" cy="420" r="240" fill="#a78bfa" opacity=".12" filter="url(#glow)"/>
    
    <!-- Perfectly Periodic Wave Lines -->
    <path d="M 0 460 C 200 420 400 420 600 460 C 800 500 1000 500 1200 460 C 1400 420 1600 420 1800 460" fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 0 480 C 200 440 400 440 600 480 C 800 520 1000 520 1200 480 C 1400 440 1600 440 1800 480" fill="none" stroke="url(#line)" stroke-width="2" stroke-opacity=".5" stroke-linecap="round"/>
  </g>

  <!-- Crisp Terminal Border -->
  <rect x="24" y="24" width="1552" height="472" rx="16" fill="none" stroke="#38bdf8" stroke-opacity=".15" stroke-width="1.5"/>

  <!-- Geometrically Centered Logo -->
  <g transform="translate(400, 260)">
    <!-- Scanning Dashed Ring -->
    <circle cx="0" cy="0" r="135" fill="none" stroke="#67e8f9" stroke-opacity=".25" stroke-width="1.5" stroke-dasharray="6 6"/>
    
    <!-- Glowing Inner Orb -->
    <circle cx="0" cy="0" r="105" fill="#0e2944" stroke="url(#orb)" stroke-width="3" filter="url(#glow)"/>
    
    <!-- Perfect Symmetrical Shield -->
    <path d="M 0 -75 L 60 -42 V 22 C 60 70 32 105 0 125 C -32 105 -60 70 -60 22 V -42 Z" fill="none" stroke="#e0f2fe" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Proportional Checkmark -->
    <path d="M -28 12 L -8 32 L 35 -18" fill="none" stroke="#67e8f9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#text-glow)"/>
  </g>

  <!-- Mathematically Aligned Text Block -->
  <g transform="translate(640, 0)">
    <!-- Main Title -->
    <text x="0" y="150" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="62" font-weight="700" filter="url(#text-glow)">◈ RepoSentinel</text>
    
    <!-- Subtitle -->
    <text x="5" y="195" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" letter-spacing="4" filter="url(#text-glow)">REPOSITORY READINESS, WITHOUT THE NOISE</text>
    
    <!-- Bilingual Taglines -->
    <text x="0" y="255" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26">Cek repository Anda sebelum orang lain menilainya.</text>
    <text x="0" y="295" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22">Make every repository ready to be understood, trusted, and shared.</text>

    <!-- Center-Aligned Feature Pills -->
    <g transform="translate(0, 335)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
      <!-- Pill 1 -->
      <rect width="150" height="44" rx="22" fill="#0f2740" stroke="#38bdf8" stroke-opacity=".6" stroke-width="1.5"/>
      <text x="75" y="22" fill="#7dd3fc" text-anchor="middle" dominant-baseline="central">local-first</text>
      
      <!-- Pill 2 -->
      <rect x="170" width="170" height="44" rx="22" fill="#1e1b4b" stroke="#a78bfa" stroke-opacity=".6" stroke-width="1.5"/>
      <text x="255" y="22" fill="#c4b5fd" text-anchor="middle" dominant-baseline="central">deterministic</text>
      
      <!-- Pill 3 -->
      <rect x="360" width="150" height="44" rx="22" fill="#0f2740" stroke="#38bdf8" stroke-opacity=".6" stroke-width="1.5"/>
      <text x="435" y="22" fill="#7dd3fc" text-anchor="middle" dominant-baseline="central">explainable</text>
    </g>
  </g>
</svg>
