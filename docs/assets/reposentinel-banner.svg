<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">RepoSentinel repository readiness CLI</title>
  <desc id="desc">A dark terminal-inspired banner with a glowing sentinel mark, readiness grid, and bilingual tagline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="55%" stop-color="#0b1930"/>
      <stop offset="100%" stop-color="#11102b"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#67e8f9" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#8be9fd" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="520" rx="28" fill="url(#bg)"/>
  <rect x="24" y="24" width="1552" height="472" rx="20" fill="url(#grid)"/>
  <circle cx="1320" cy="95" r="190" fill="#38bdf8" opacity=".08" filter="url(#glow)"/>
  <circle cx="1500" cy="440" r="230" fill="#a78bfa" opacity=".08" filter="url(#glow)"/>
  <path d="M0 410 C300 350 430 485 760 415 S1260 330 1600 405" fill="none" stroke="url(#line)" stroke-width="2"/>
  <g transform="translate(138 125)">
    <circle cx="122" cy="122" r="90" fill="none" stroke="#67e8f9" stroke-opacity=".23" stroke-width="2"/>
    <circle cx="122" cy="122" r="69" fill="#0e2944" stroke="url(#orb)" stroke-width="4" filter="url(#glow)"/>
    <path d="M122 67 166 91v51c0 34-20 57-44 70-24-13-44-36-44-70V91l44-24Z" fill="none" stroke="#e0f2fe" stroke-width="7" stroke-linejoin="round"/>
    <path d="m99 122 16 16 31-34" fill="none" stroke="#67e8f9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="360" y="186" fill="#e0f2fe" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="58" font-weight="700">◈ RepoSentinel</text>
  <text x="364" y="244" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" letter-spacing="3">REPOSITORY READINESS, WITHOUT THE NOISE</text>
  <text x="364" y="315" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="27">Cek repository Anda sebelum orang lain menilainya.</text>
  <text x="364" y="357" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="23">Make every repository ready to be understood, trusted, and shared.</text>
  <g transform="translate(365 405)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
    <rect width="172" height="40" rx="20" fill="#102d47" stroke="#38bdf8" stroke-opacity=".55"/>
    <text x="22" y="26" fill="#67e8f9">local-first</text>
    <rect x="188" width="184" height="40" rx="20" fill="#241d45" stroke="#a78bfa" stroke-opacity=".55"/>
    <text x="210" y="26" fill="#c4b5fd">deterministic</text>
    <rect x="388" width="144" height="40" rx="20" fill="#102d47" stroke="#38bdf8" stroke-opacity=".55"/>
    <text x="412" y="26" fill="#67e8f9">explainable</text>
  </g>
</svg>
