name: Publish VS Code extension

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type publish to confirm VS Code Marketplace publication"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Package and publish VS Code extension
    if: ${{ inputs.confirm == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and package VSIX
        working-directory: packages/vscode
        run: pnpm package

      - name: Publish VSIX
        working-directory: packages/vscode
        run: pnpm exec vsce publish --packagePath reposentinel-diagnostics-*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
