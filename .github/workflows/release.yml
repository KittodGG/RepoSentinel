name: Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type publish to confirm npm publication"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Release gate and npm publish
    if: ${{ inputs.confirm == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release gate
        run: pnpm release:gate

      - name: Publish package with provenance
        run: npm publish artifacts/reposentinel-*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
