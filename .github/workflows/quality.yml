name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, test, build, and smoke scan (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Smoke scan repository
        run: node packages/cli/dist/index.js check . --profile public --lang en --format json --no-color --output "${{ runner.temp }}/reposentinel-quality-report.json"

      - name: Validate smoke report
        env:
          REPORT_PATH: ${{ runner.temp }}/reposentinel-quality-report.json
        run: |
          node --input-type=module -e '
          import { readFile } from "node:fs/promises";
          const report = JSON.parse(await readFile(process.env.REPORT_PATH, "utf8"));
          if (report.schemaVersion !== "reposentinel.report/v1") throw new Error("Unexpected report schema");
          if (report.locale !== "en") throw new Error("Unexpected report locale");
          '
